<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Cartão de Perfil</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="from">
        <h1>Gerador de Cartão de Perfil</h1>
        <input type="text" name="nome" id="nome" placeholder="seu nome">
        <input type="text" name="cargo" id="cargo" placeholder="sua profissão">
        <button id="btnGerar">Gerar Cartão</button>
    </div>
    <div class="card" id="cartao">
        <span class="nome">seu nome aqui</span>
        <span class="cargo">sua profissão aqui</span>
    </div>
    <p class="contador" id="contador">Cartões gerados: 0</p>
</body>
</html>
